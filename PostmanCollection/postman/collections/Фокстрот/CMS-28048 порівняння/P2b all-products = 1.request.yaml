$kind: http-request
url: "{{cmp_base}}/v0/38044/1/comparison/{{cmp_customerId}}/all-products"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token_api_main}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('1 шт', () => pm.expect(pm.response.json().length).to.eql(1));
      pm.test('той самий товар', () => pm.expect(pm.response.json()[0].id).to.eql(Number(pm.variables.get('cmp_objectId'))));
    language: text/javascript
order: 4000
