$kind: http-request
description: |-
  Облікові дані — з оточення «Фокстрот local» (PostmanCollection/local.postman_environment.json). api-main має власні акаунти (foxtrot-api-main/appsettings.json → AuthenticationSettings.Accounts); apiConsumer з api-exchange він не знає (400). Тут — mobile-app-consumer (роль mobile), той самий шлях, що в застосунку. Порожнє порівняння в ComparisonController дозволене ролям site і mobile.
url: "{{cmp_base}}/v0/authentication/token"
method: GET
headers:
  login: "{{api_main_login}}"
  password: "{{api_main_password}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const t = (() => { try { const j = pm.response.json(); return j.token || j.accessToken || j; } catch (e) { return pm.response.text().replace(/"/g, ''); } })();
      pm.collectionVariables.set('token_api_main', t);
    language: text/javascript
order: 1000
