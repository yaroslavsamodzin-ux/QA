$kind: http-request
description: |-
  Очікуємо 200 [] (гілка id == null), не 500.
url: "{{cmp_base}}/v0/38044/1/comparison/999999999/all-products"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token_api_main}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('тіло рівно []', () => pm.expect(pm.response.json()).to.eql([]));
      pm.test('json', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
    language: text/javascript
order: 18000
