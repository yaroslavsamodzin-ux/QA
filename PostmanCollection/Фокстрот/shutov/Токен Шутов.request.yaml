$kind: http-request
url: https://shutov.api-exchange.foxtrot.cloud/v0/authentication/token
method: GET
headers:
  login: "{{api_login}}"
  password: "{{api_password}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is valid JSON and contains token\", function () {\r

      \    pm.response.to.be.json;\r

      \    pm.expect(pm.response.json()).to.have.property(\"token\");\r

      \    pm.collectionVariables.set(\"token\", pm.response.json().token);\r

      });"
    language: text/javascript
settings: {}
order: 1000
